name: build libluajava

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
      
      - name: Find jni folder
        run: |
          find . -name "Android.mk" -o -name "Application.mk" | head -20
      
      - name: Build libluajava
        run: |
          cd $(find . -name "Android.mk" -exec dirname {} \; | head -1)
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI=arm64-v8a
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libluajava-arm64
          path: |
            **/libs/arm64-v8a/libluajava.so
            **/obj/local/arm64-v8a/libluajava.so
