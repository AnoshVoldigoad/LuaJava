name: build libluajava

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: List repo contents
        run: find . -type f | head -50

      - name: Build libluajava
        run: |
          cd $(dirname $(find . -name "Android.mk" | head -1))
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI=arm64-v8a NDK_DEBUG=0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libluajava-arm64
          path: |
            **/libs/arm64-v8a/*.so
            **/obj/local/arm64-v8a/*.so
          if-no-files-found: warn
